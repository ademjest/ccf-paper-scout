name: Set up optional CPU embeddings
description: Install the pinned CPU inference stack and cache public model weights only
inputs:
  mode:
    description: off, shadow, or production
    default: 'off'
runs:
  using: composite
  steps:
    - if: inputs.mode != 'off'
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: bge-small-cpu-${{ runner.os }}-py312-5c38ec7c-${{ hashFiles('constraints-semantic.txt') }}
    - if: inputs.mode != 'off'
      shell: bash
      run: |
        python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install '.[semantic]' -c constraints-semantic.txt
