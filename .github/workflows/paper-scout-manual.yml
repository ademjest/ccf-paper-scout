name: Paper Scout Manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe validation mode
        required: true
        type: choice
        default: doctor
        options: [doctor, smtp-test, discover, evaluate, preview, production]
      semantic_mode:
        description: Embedding mode (production requires private calibration.json)
        type: choice
        default: 'off'
        options: ['off', shadow, production]
      max_results:
        description: Maximum recommendations for preview/production
        required: true
        default: '10'
      relation_mode:
        description: LLM/RL role policy (shadow compares only; production enforces evidence gates)
        type: choice
        default: shadow
        options: [shadow, production]

permissions:
  contents: read

concurrency:
  group: paper-scout-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: ./.github/actions/setup-semantic
        if: inputs.mode == 'preview' || inputs.mode == 'evaluate' || inputs.mode == 'production'
        with:
          mode: ${{ inputs.semantic_mode }}
      - name: Record runtime version
        run: |
          git rev-parse HEAD
          python -c 'import paper_scout; print(paper_scout.__file__)'
      - name: Restore private state
        if: inputs.mode == 'preview' || inputs.mode == 'production' || inputs.mode == 'discover' || inputs.mode == 'evaluate'
        env:
          STATE_REPO: ${{ vars.STATE_REPO }}
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" clone "https://github.com/${STATE_REPO}.git" .runtime-state
          git -C .runtime-state remote set-url origin "https://github.com/${STATE_REPO}.git"
          python scripts/actions_state.py prepare --dir .runtime-state/state
          python scripts/actions_state.py verify --dir .runtime-state/state
      - name: Prepare stateless directory
        if: inputs.mode == 'doctor' || inputs.mode == 'smtp-test'
        run: mkdir -p .runtime-state/state
      - name: Build ephemeral config
        env:
          REQUESTED_MAX_RESULTS: ${{ inputs.max_results }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SEMANTIC_MODE: ${{ inputs.semantic_mode }}
          RELATION_MODE: ${{ inputs.relation_mode }}
        run: |
          case "$REQUESTED_MAX_RESULTS" in (*[!0-9]*|'') echo "max_results must be an integer"; exit 2;; esac
          if [ "$REQUESTED_MAX_RESULTS" -lt 1 ] || [ "$REQUESTED_MAX_RESULTS" -gt 20 ]; then echo "max_results must be 1..20"; exit 2; fi
          EXTRA=""
          if [ "$REQUESTED_MODE" != "production" ]; then EXTRA="--disable-smtp"; fi
          python scripts/build_actions_config.py --base config.example.json --output config.action.json --state-dir .runtime-state/state --max-results "$REQUESTED_MAX_RESULTS" $EXTRA
      - name: Doctor
        if: inputs.mode == 'doctor'
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: ccf-paper-scout doctor --config config.action.json
      - name: SMTP test
        if: inputs.mode == 'smtp-test'
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: ccf-paper-scout test-delivery --config config.action.json
      - name: Preview
        if: inputs.mode == 'preview'
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: ccf-paper-scout run --config config.action.json --output recommendations.md --no-update-seen
      - name: Discover without delivery
        if: inputs.mode == 'discover'
        run: ccf-paper-scout discover --config config.action.json --output recommendations-discovery.json
      - name: Evaluate saved candidate snapshot
        if: inputs.mode == 'evaluate'
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          EXTRA=()
          if [ -f .runtime-state/state/evaluation-labels.json ]; then EXTRA=(--labels .runtime-state/state/evaluation-labels.json); fi
          ccf-paper-scout evaluate --config config.action.json --output recommendations-evaluation.md "${EXTRA[@]}"
      - name: Check unresolved delivery transaction
        if: inputs.mode == 'production'
        run: |
          if [ -f .runtime-state/state/.delivery-pending ]; then
            echo "Unresolved prior delivery exists; inspect the previous Actions run and private state before retrying."
            exit 3
          fi
      - name: Production
        if: inputs.mode == 'production'
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
          PAPER_SCOUT_DELIVERY_GATE: .runtime-state/state/.delivery-approved
        run: |
          ccf-paper-scout run --config config.action.json --output recommendations.md & scout_pid=$!
          while [ ! -f .runtime-state/state/.delivery-pending ] && kill -0 "$scout_pid" 2>/dev/null; do sleep 1; done
          if [ -f .runtime-state/state/.delivery-pending ]; then
            git -C .runtime-state config user.name "github-actions[bot]"
            git -C .runtime-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C .runtime-state add state/.delivery-pending
            git -C .runtime-state commit -m "state: pending delivery ${GITHUB_RUN_ID}"
            basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
            git -C .runtime-state -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin HEAD:main
            touch .runtime-state/state/.delivery-approved
          fi
          wait "$scout_pid"
      - name: Persist production state
        if: (inputs.mode == 'production' || inputs.mode == 'discover') && always()
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        working-directory: .runtime-state
        run: |
          python ../scripts/actions_state.py checkpoint --dir state

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state: paper scout run ${GITHUB_RUN_ID}"
            basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin HEAD:main
          fi
      - name: Save private preview and evaluation reports
        if: (inputs.mode == 'preview' || inputs.mode == 'evaluate') && success()
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        working-directory: .runtime-state
        run: |
          report_dir="reports/${GITHUB_RUN_ID}"
          mkdir -p "$report_dir"
          for report in ../recommendations*.md ../recommendations*.diagnostics.json; do
            if [ -f "$report" ]; then cp "$report" "$report_dir/"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$report_dir"
          git commit -m "reports: private paper scout preview ${GITHUB_RUN_ID}"
          basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin HEAD:main
      - name: Preview privacy notice
        if: (inputs.mode == 'preview' || inputs.mode == 'evaluate') && success()
        run: echo 'Preview/evaluation used an isolated state copy. Reports are in the private state repository under reports/<run-id>/; production state was not updated.' >> "$GITHUB_STEP_SUMMARY"
