name: Paper Scout Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # 04:00 Asia/Shanghai next day; app never sends before 09:00 and sends late runs ASAP

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: paper-scout-production
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: ./.github/actions/setup-semantic
        with:
          mode: ${{ vars.SEMANTIC_MODE || 'off' }}
      - name: Record runtime version
        run: |
          git rev-parse HEAD
          python -c 'import paper_scout; print(paper_scout.__file__)'
      - name: Restore private state
        id: restore_state
        env:
          STATE_REPO: ${{ vars.STATE_REPO }}
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          if [ -z "$STATE_REPO" ] || [ -z "$STATE_REPO_TOKEN" ]; then
            echo "::error::Configure the STATE_REPO variable and STATE_REPO_TOKEN secret before restoring private state."
            exit 2
          fi
          basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
          if ! GIT_TERMINAL_PROMPT=0 git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" clone --depth 1 --branch main "https://github.com/${STATE_REPO}.git" .runtime-state; then
            echo "::error::Private state clone failed. Check the STATE_REPO path, STATE_REPO_TOKEN expiry and repository Contents read/write access, and the Git error above. Delivery will not run without restored history."
            exit 1
          fi
          git -C .runtime-state remote set-url origin "https://github.com/${STATE_REPO}.git"
          python scripts/actions_state.py restore --dir .runtime-state/state
          python scripts/actions_state.py verify --dir .runtime-state/state
      - name: Build ephemeral config
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SEMANTIC_MODE: ${{ vars.SEMANTIC_MODE || 'off' }}
          RELATION_MODE: ${{ vars.RELATION_MODE || 'shadow' }}
          INTEREST_SOURCE: ${{ vars.INTEREST_SOURCE }}
          RESEARCH_PROFILE: ${{ vars.RESEARCH_PROFILE || 'legacy' }}
        run: python scripts/build_actions_config.py --base config.example.json --output config.action.json --state-dir .runtime-state/state --max-results 5
      - name: Verify generated runtime config
        run: |
          python -c 'import json; value=json.load(open("config.action.json"))["max_results"]; assert value == 5; print("Runtime max_results:", value)'
      - name: Doctor
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: ccf-paper-scout doctor --config config.action.json
      - name: Check unresolved delivery transaction
        run: |
          if [ -f .runtime-state/state/.delivery-pending ]; then
            echo "Unresolved prior delivery exists; inspect the previous Actions run and private state before retrying."
            exit 3
          fi
      - name: Deliver daily digest
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
          PAPER_SCOUT_DELIVERY_GATE: .runtime-state/state/.delivery-approved
          PAPER_SCOUT_SCHEDULED_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          PAPER_SCOUT_TIMEZONE: Asia/Shanghai
          PAPER_SCOUT_DELIVERY_TIME: '09:00'
        run: bash scripts/actions_delivery.sh
      - name: Persist state immediately after delivery
        if: always() && steps.restore_state.outcome == 'success'
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        working-directory: .runtime-state
        run: |
          status=0
          python ../scripts/actions_state.py persist --dir state || status=$?
          python ../scripts/actions_state.py stats --dir state --config ../config.action.json >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
