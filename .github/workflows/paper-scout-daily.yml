name: Paper Scout Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai (UTC+8)

permissions:
  contents: read

concurrency:
  group: paper-scout-production
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
      SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      STATE_REPO: ${{ vars.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Restore private state
        run: |
          basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" clone "https://github.com/${STATE_REPO}.git" .runtime-state
          git -C .runtime-state remote set-url origin "https://github.com/${STATE_REPO}.git"
          python scripts/actions_state.py prepare --dir .runtime-state/state
          python scripts/actions_state.py verify --dir .runtime-state/state
      - name: Build ephemeral config
        run: python scripts/build_actions_config.py --base config.example.json --output config.action.json --state-dir .runtime-state/state --max-results 20
      - name: Doctor
        run: ccf-paper-scout doctor --config config.action.json
      - name: Check unresolved delivery transaction
        run: |
          if [ -f .runtime-state/state/.delivery-pending ]; then
            echo "Unresolved prior delivery exists; inspect the previous Actions run and private state before retrying."
            exit 3
          fi
      - name: Mark delivery pending in private state
        working-directory: .runtime-state
        run: |
          printf 'run_id=%s\ncreated_at=%s\n' "$GITHUB_RUN_ID" "$(date -u +'%FT%TZ')" > state/.delivery-pending
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/.delivery-pending
          git commit -m "state: pending delivery ${GITHUB_RUN_ID}"
          basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin HEAD:main
      - name: Deliver daily digest
        run: ccf-paper-scout run --config config.action.json --output recommendations.md
      - name: Persist state immediately after delivery
        if: success()
        working-directory: .runtime-state
        run: |
          python ../scripts/actions_state.py checkpoint --dir state
          rm -f state/.delivery-pending
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state: paper scout run ${GITHUB_RUN_ID}"
            basic=$(printf 'x-access-token:%s' "$STATE_REPO_TOKEN" | base64 -w0)
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin HEAD:main
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-scout-daily-${{ github.run_id }}
          path: recommendations.md
          if-no-files-found: ignore
          retention-days: 7
