name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile paper_scout.py state_store.py src/ccf_paper_scout/*.py tests/*.py
      - name: Package and CLI smoke test
        run: |
          python -m pip install .
          ccf-paper-scout --help
          ccf-paper-scout doctor --config config.example.json --no-network || test $? -eq 2
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Repository validation
        run: |
          python scripts/validate_repo.py
          python scripts/build_venue_data.py --check
