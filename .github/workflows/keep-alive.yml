name: Keep Scheduled Workflows Active

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update activity marker
        run: |
          printf 'Last scheduled activity: %s UTC\n' "$(date -u +'%Y-%m-%d %H:%M:%S')" > .github/keep-alive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: keep scheduled workflows active [skip ci]"
            git push
          fi
