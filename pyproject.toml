[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf-paper-scout"
version = "0.2.0"
description = "Low-resource Zotero-driven CCF-A paper scout"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ademjest"}]
dependencies = ["tzdata>=2025.1; sys_platform == 'win32'"]

[project.optional-dependencies]
semantic = ["sentence-transformers==3.4.1", "numpy>=1.26,<3"]

[project.scripts]
ccf-paper-scout = "ccf_paper_scout.cli:main"

[tool.setuptools]
packages = ["ccf_paper_scout"]
py-modules = ["paper_scout", "state_store"]
package-dir = {"ccf_paper_scout" = "src/ccf_paper_scout"}

[tool.setuptools.package-data]
ccf_paper_scout = ["data/*.json"]
